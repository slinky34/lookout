# Lookout: tells you when your containers' images or watched GitHub projects update.
# It only reads; it never pulls images or restarts anything.
#
#   cp .env.example .env              # add your Discord webhook / ntfy / Gotify
#   cp config.example.yaml config/config.yaml  # optional: GitHub repos, schedule, exclusions
#   docker compose up -d
#   docker compose run --rm lookout --test-notify   # check notifications work

services:
  lookout:
    image: ghcr.io/slinky34/lookout:latest
    # build: .   # to build from this folder instead
    container_name: lookout
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/config:ro   # holds config.yaml (optional)
      - lookout-data:/data

volumes:
  lookout-data:
