# Lookout: dashboard + notifications for updates to your containers, other Docker
# hosts, Portainer environments, images and GitHub releases. It changes nothing unless
# you click Update in the dashboard and confirm, and then only through Portainer.
#
#   docker compose up -d
#   open http://<server>:18099 and add notifications, repos and hosts there
#
# Everything can be set in the dashboard. The environment variables below are optional
# starting values (handy in Portainer); values saved in the dashboard take priority.

services:
  lookout:
    image: ghcr.io/slinky34/lookout:latest
    # build: .   # to build from this folder instead
    container_name: lookout
    restart: unless-stopped
    ports:
      - "18099:18099"
    environment:
      TZ: ${TZ:-UTC}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      NTFY_URL: ${NTFY_URL:-}
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Portainer: watch every environment and update stacks from the dashboard.
      PORTAINER_URL: ${PORTAINER_URL:-}
      PORTAINER_TOKEN: ${PORTAINER_TOKEN:-}
      # Ask for a password before showing the dashboard (any username works):
      LOOKOUT_PASSWORD: ${LOOKOUT_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - lookout-data:/data

volumes:
  lookout-data:
